name: Refresh profile data

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Sync current GitHub profile photo
        run: python .github/scripts/update-avatar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate live statistics and recent repositories
        run: node .github/scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Generate animated contribution snake from GitHub activity
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8

      - name: Install generated contribution snake
        run: |
          test -s dist/github-contribution-grid-snake-dark.svg
          mkdir -p assets/generated
          cp dist/github-contribution-grid-snake-dark.svg assets/generated/contribution-snake.svg
          test -s assets/generated/contribution-snake.svg
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in [
              "assets/generated/github-stats.svg",
              "assets/generated/top-languages.svg",
              "assets/generated/contributions.svg",
              "assets/generated/contribution-snake.svg",
          ]:
              ET.parse(path)
              print(f"Validated {path}")
          PY

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated assets/profile-avatar.png README.md
          if git diff --cached --quiet; then
            echo "No profile changes to publish."
          else
            git commit -m "chore: refresh live GitHub profile data"
            git push
          fi

name: Refresh profile data

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processing dependency
        run: python -m pip install --disable-pip-version-check Pillow requests

      - name: Sync current GitHub profile photo
        run: python .github/scripts/update-avatar.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate live statistics, synchronized contributions and recent repositories
        run: node .github/scripts/update-profile.mjs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Generate animated contribution snake
        if: env.HAS_PAT != ''
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_PAT }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%2314243b,%230e4429,%23006d32,%2326a641,%2339d353

      - name: Install generated snake from PAT
        if: env.HAS_PAT != ''
        continue-on-error: true
        run: |
          if [ -s dist/github-contribution-grid-snake-dark.svg ]; then
            mkdir -p assets/generated
            cp dist/github-contribution-grid-snake-dark.svg assets/generated/contribution-snake.svg
            echo "Installed live PAT-driven contribution snake."
          fi

      - name: Validate generated profile assets
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          paths = [
              "assets/generated/github-stats.svg",
              "assets/generated/top-languages.svg",
              "assets/generated/contributions.svg",
              "assets/generated/contribution-snake.svg",
          ]

          for path in paths:
              file = Path(path)
              if not file.exists() or file.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty asset: {path}")
              ET.parse(file)
              print(f"Validated: {path}")
          PY

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/generated assets/profile-avatar.png README.md

          if git diff --cached --quiet; then
            echo "No profile changes to publish."
          else
            git commit -m "chore: refresh live GitHub profile data [skip ci]"
            git push origin HEAD:main
          fi

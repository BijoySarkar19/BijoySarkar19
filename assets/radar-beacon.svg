<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <filter id="beaconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes beaconPulse {
        0%, 100% { r: 10px; opacity: 0.8; filter: drop-shadow(0 0 5px #00f2fe); }
        50% { r: 15px; opacity: 1; filter: drop-shadow(0 0 15px #00f2fe); }
      }
      .sweep-arm { animation: radarSweep 4s linear infinite; transform-origin: 120px 120px; }
      .beacon-core { animation: beaconPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Concentric Radar Rings -->
  <circle cx="120" cy="120" r="105" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="120" cy="120" r="80" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <circle cx="120" cy="120" r="52" stroke="#00f2fe" stroke-width="2.5" opacity="0.85"/>
  <circle cx="120" cy="120" r="26" fill="#091b38" stroke="#00f2fe" stroke-width="3" filter="url(#beaconGlow)"/>

  <!-- Rotating Radar Sweep Line -->
  <line x1="120" y1="120" x2="225" y2="120" stroke="#00f2fe" stroke-width="3" class="sweep-arm" filter="url(#beaconGlow)"/>

  <!-- Pulsing Center Node -->
  <circle cx="120" cy="120" r="11" fill="#00f2fe" class="beacon-core"/>
  <circle cx="120" cy="120" r="5" fill="#ffffff"/>
</svg>

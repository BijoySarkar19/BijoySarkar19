<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360" fill="none">
  <defs>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="320" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="45%" stop-color="#0a1932"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="cyanStroke" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      @keyframes pulseCore {
        0%, 100% { r: 16px; opacity: 0.8; filter: drop-shadow(0 0 6px #00f2fe); }
        50% { r: 21px; opacity: 1; filter: drop-shadow(0 0 16px #00f2fe); }
      }
      @keyframes rotateRings {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .shield-core { animation: pulseCore 2.5s ease-in-out infinite; transform-origin: 160px 180px; }
      .rotating-ring { animation: rotateRings 20s linear infinite; transform-origin: 160px 180px; }
      .data-bus { stroke-dasharray: 6 4; animation: dashMove 3s linear infinite; }
    </style>
  </defs>

  <!-- Outer Cybernetic Hull -->
  <path d="M160 20 L290 70 V190 C290 270 160 340 160 340 C160 340 30 270 30 190 V70 L160 20 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanStroke)" stroke-width="3" filter="url(#shieldGlow)"/>

  <!-- Inner Plate -->
  <path d="M160 48 L265 88 V180 C265 245 160 305 160 305 C160 305 55 245 55 180 V88 L160 48 Z" 
        fill="#071224" stroke="#1d4ed8" stroke-width="1.5" opacity="0.9"/>

  <!-- Circuit Trace Channels -->
  <line x1="160" y1="50" x2="160" y2="125" stroke="#00f2fe" stroke-width="2" class="data-bus"/>
  <line x1="80" y1="125" x2="135" y2="160" stroke="#38bdf8" stroke-width="1.5" class="data-bus"/>
  <line x1="240" y1="125" x2="185" y2="160" stroke="#38bdf8" stroke-width="1.5" class="data-bus"/>
  <line x1="160" y1="225" x2="160" y2="295" stroke="#00f2fe" stroke-width="2" class="data-bus"/>

  <!-- Orbital Targeting Ring -->
  <circle cx="160" cy="180" r="54" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="14 8" class="rotating-ring" opacity="0.7"/>

  <!-- Hexagonal AI Neural Core -->
  <polygon points="160,135 200,158 200,202 160,225 120,202 120,158" 
           fill="#0c234b" stroke="#00f2fe" stroke-width="2.5" filter="url(#shieldGlow)"/>

  <!-- Center Energy Orb -->
  <circle cx="160" cy="180" r="18" fill="#00f2fe" class="shield-core"/>
  <circle cx="160" cy="180" r="8" fill="#ffffff"/>

  <!-- Status Markers -->
  <circle cx="80" cy="125" r="3.5" fill="#00f2fe"/>
  <circle cx="240" cy="125" r="3.5" fill="#00f2fe"/>
  <circle cx="160" cy="295" r="4.5" fill="#00f2fe"/>
</svg>

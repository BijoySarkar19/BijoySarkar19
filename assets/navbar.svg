<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 70" width="960" height="70" fill="none">
  <defs>
    <filter id="navGlow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="navBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1835"/>
      <stop offset="50%" stop-color="#0c2149"/>
      <stop offset="100%" stop-color="#061126"/>
    </linearGradient>
    <linearGradient id="navBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.7; r: 4px; filter: drop-shadow(0 0 2px #00f2fe); }
        50% { opacity: 1; r: 5.5px; filter: drop-shadow(0 0 8px #00f2fe); }
      }
      .live-dot { animation: pulseDot 2s infinite ease-in-out; }
      .nav-link {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #94a3b8;
        letter-spacing: 0.08em;
        transition: fill 0.2s;
      }
      .nav-link:hover, .nav-link.active {
        fill: #ffffff;
      }
      .nav-brand-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 0.15em;
      }
      .btn-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.06em;
      }
    </style>
  </defs>

  <!-- Capsule Hull -->
  <rect x="8" y="8" width="944" height="54" rx="27" fill="url(#navBgGrad)" stroke="url(#navBorder)" stroke-width="1.8" filter="url(#navGlow)"/>

  <!-- Brand Section (Left) -->
  <g transform="translate(36, 35)">
    <circle cx="0" cy="0" r="4.5" fill="#00f2fe" class="live-dot"/>
    <text x="14" y="5" class="nav-brand-text">BIJOY</text>
  </g>

  <!-- Navigation Links (Center) -->
  <g transform="translate(195, 39)">
    <text x="0" y="0" class="nav-link active" fill="#ffffff">HOME</text>
    <!-- Active Indicator Bar -->
    <rect x="0" y="6" width="42" height="2" rx="1" fill="#00f2fe"/>

    <text x="75" y="0" class="nav-link">ABOUT</text>
    <text x="160" y="0" class="nav-link">CERTIFICATES</text>
    <text x="290" y="0" class="nav-link">SKILLS</text>
    <text x="375" y="0" class="nav-link">PROJECTS</text>
    <text x="480" y="0" class="nav-link">CONTACT</text>
  </g>

  <!-- CTA Button (Right): "Hire Me / View CV" -->
  <g transform="translate(815, 17)">
    <rect width="112" height="36" rx="18" fill="url(#btnGrad)" stroke="#ffffff" stroke-width="0.8"/>
    <text x="56" y="23" text-anchor="middle" class="btn-text">HIRE ME ↗</text>
  </g>
</svg>

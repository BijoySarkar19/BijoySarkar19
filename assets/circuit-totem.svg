<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" width="240" height="340" fill="none">
  <defs>
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="totemGrad" x1="0" y1="0" x2="240" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 4px #00f2fe); }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #00f2fe); }
      }
      @keyframes pulseSignal {
        to { stroke-dashoffset: -32; }
      }
      .signal-line { stroke-dasharray: 8 4; animation: pulseSignal 2.5s linear infinite; }
      .p-node { animation: pulseNode 3s ease-in-out infinite; transform-origin: 120px 170px; }
    </style>
  </defs>

  <!-- Vertical Data Backbone -->
  <line x1="120" y1="20" x2="120" y2="320" stroke="url(#totemGrad)" stroke-width="4" class="signal-line"/>
  
  <!-- Top Node: Logic Gate -->
  <circle cx="120" cy="55" r="16" fill="#091834" stroke="#00f2fe" stroke-width="2.5" filter="url(#circuitGlow)"/>
  <circle cx="120" cy="55" r="7" fill="#00f2fe"/>
  <path d="M120 55 H185 V95 H215" stroke="#38bdf8" stroke-width="2" fill="none" class="signal-line"/>
  <circle cx="215" cy="95" r="5" fill="#38bdf8"/>

  <!-- Center Microprocessor Unit -->
  <g class="p-node">
    <circle cx="120" cy="170" r="24" fill="#091834" stroke="#00f2fe" stroke-width="2.5" filter="url(#circuitGlow)"/>
    <rect x="109" y="159" width="22" height="22" fill="#00f2fe" rx="4"/>
    <rect x="115" y="165" width="10" height="10" fill="#ffffff" rx="2"/>
  </g>
  <path d="M120 170 H55 V130 H25" stroke="#38bdf8" stroke-width="2" fill="none" class="signal-line"/>
  <circle cx="25" cy="130" r="5" fill="#38bdf8"/>

  <!-- Bottom Node: I/O Interface -->
  <circle cx="120" cy="285" r="16" fill="#091834" stroke="#00f2fe" stroke-width="2.5" filter="url(#circuitGlow)"/>
  <circle cx="120" cy="285" r="7" fill="#00f2fe"/>
  <path d="M120 285 H185 V255 H210" stroke="#38bdf8" stroke-width="2" fill="none" class="signal-line"/>
  <circle cx="210" cy="255" r="5" fill="#38bdf8"/>
</svg>
